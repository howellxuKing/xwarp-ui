name: release-build-check

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish checked public release images'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org --fetch-timeout=30000

      - name: Build frontend
        # Browser cookie compatibility is part of the private release check.
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Check legacy authentication cookies
        run: |
          node tests/auth-cookies.cjs
          node tests/session-expiry.cjs
          node tests/session-interceptor.cjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ inputs.publish_release }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.publish_release }}
          tags: |
            ghcr.io/howellxuking/xwarp-ui:sha-${{ github.sha }}
            ghcr.io/howellxuking/xwarp-ui:latest
          labels: org.opencontainers.image.source=https://github.com/howellxuKing/xwarp-ui

      - name: Verify public anonymous image pull
        if: ${{ inputs.publish_release }}
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: DOCKER_CONFIG="$(mktemp -d)" docker pull "ghcr.io/howellxuking/xwarp-ui@$IMAGE_DIGEST"

      - name: Record immutable image
        if: ${{ inputs.publish_release }}
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          repository = "ghcr.io/howellxuking/xwarp-ui"
          Path("image-release.json").write_text(json.dumps({"repository": repository, "commit": os.environ["IMAGE_COMMIT"], "digest": os.environ["IMAGE_DIGEST"], "image": repository + "@" + os.environ["IMAGE_DIGEST"], "platform": "linux/amd64"}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.publish_release }}
        with:
          name: image-release
          path: image-release.json
          retention-days: 30
